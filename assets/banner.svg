<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a9bff"/>
      <stop offset="1" stop-color="#3b7ddd"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#2a3550" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- document + sparkle emblem -->
  <g transform="translate(120,78)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="190" rx="14" fill="url(#paper)"/>
    <rect x="22" y="30" width="80" height="9" rx="4.5" fill="#9fb4d8"/>
    <rect x="22" y="54" width="106" height="7" rx="3.5" fill="#c4d2e8"/>
    <rect x="22" y="72" width="106" height="7" rx="3.5" fill="#c4d2e8"/>
    <rect x="22" y="90" width="72" height="7" rx="3.5" fill="#c4d2e8"/>
    <rect x="22" y="120" width="106" height="7" rx="3.5" fill="#dbe5f3"/>
    <rect x="22" y="138" width="106" height="7" rx="3.5" fill="#dbe5f3"/>
    <rect x="22" y="156" width="54" height="7" rx="3.5" fill="#dbe5f3"/>
    <!-- citation pill -->
    <rect x="96" y="150" width="40" height="22" rx="11" fill="url(#accent)"/>
    <text x="116" y="166" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">p3</text>
    <!-- sparkle -->
    <g transform="translate(132,-8)">
      <path d="M0,-18 L5,-5 L18,0 L5,5 L0,18 L-5,5 L-18,0 L-5,-5 Z" fill="#ffd400"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(330,120)">
    <text x="0" y="0" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">AI Reader</text>
    <text x="4" y="46" font-size="25" font-weight="500" fill="#9db2d6">AI-assisted paper reading, right inside Zotero</text>
    <g transform="translate(4,78)" font-size="16" font-weight="600">
      <rect x="0" y="-18" width="188" height="30" rx="15" fill="#1b2540" stroke="#2f3d61"/>
      <text x="94" y="2" fill="#7fe0a3" text-anchor="middle">⟲ 反向召回到原文</text>
      <rect x="204" y="-18" width="150" height="30" rx="15" fill="#1b2540" stroke="#2f3d61"/>
      <text x="279" y="2" fill="#ffd36b" text-anchor="middle">✎ AI 写标注</text>
      <rect x="370" y="-18" width="176" height="30" rx="15" fill="#1b2540" stroke="#2f3d61"/>
      <text x="458" y="2" fill="#8ab6ff" text-anchor="middle">∑ Markdown + 公式</text>
    </g>
  </g>
</svg>
