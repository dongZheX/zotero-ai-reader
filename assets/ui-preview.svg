<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#151a26"/>
    </linearGradient>
    <linearGradient id="send" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a9bff"/>
      <stop offset="1" stop-color="#3b7ddd"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="760" height="620" fill="#0d1117"/>

  <!-- panel card -->
  <g filter="url(#card)">
    <rect x="40" y="30" width="680" height="560" rx="16" fill="url(#win)" stroke="#2a3346"/>
  </g>

  <!-- header -->
  <text x="68" y="72" font-size="18" font-weight="700" fill="#e7edf7">AI 阅读</text>
  <rect x="520" y="54" width="112" height="28" rx="8" fill="#232c3f" stroke="#33405a"/>
  <text x="576" y="73" font-size="13" font-weight="600" fill="#b9c6de" text-anchor="middle">存为笔记</text>
  <text x="660" y="74" font-size="18" fill="#8a93a6">⚙</text>
  <line x1="68" y1="92" x2="692" y2="92" stroke="#2a3346"/>

  <!-- assistant bubble -->
  <g transform="translate(68,112)">
    <rect x="0" y="0" width="470" height="150" rx="14" fill="#202a3c"/>
    <text x="18" y="30" font-size="14" font-weight="700" fill="#e7edf7">本文提出一种检索增强的阅读框架</text>
    <rect x="18" y="46" width="340" height="9" rx="4.5" fill="#3a4761"/>
    <rect x="18" y="64" width="400" height="9" rx="4.5" fill="#3a4761"/>
    <rect x="18" y="82" width="300" height="9" rx="4.5" fill="#3a4761"/>
    <!-- math chip -->
    <rect x="18" y="100" width="150" height="26" rx="6" fill="#161d2b" stroke="#2f3c56"/>
    <text x="30" y="118" font-size="13" fill="#9db2d6" font-style="italic">E = mc²</text>
    <!-- citation badge -->
    <rect x="178" y="100" width="42" height="26" rx="13" fill="url(#send)"/>
    <text x="199" y="118" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">p3</text>
    <!-- apply-highlight button -->
    <rect x="230" y="100" width="92" height="26" rx="13" fill="#3a2f12" stroke="#6b5212"/>
    <text x="276" y="118" font-size="12" font-weight="600" fill="#ffd36b" text-anchor="middle">应用划线</text>
  </g>

  <!-- user bubble (right) -->
  <g transform="translate(372,278)">
    <rect x="0" y="0" width="320" height="52" rx="14" fill="#2f4a7d"/>
    <text x="20" y="31" font-size="14" fill="#eaf1ff">这篇的主要贡献和局限是什么？</text>
  </g>

  <!-- chips -->
  <g transform="translate(68,352)" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="96" height="30" rx="15" fill="#20283a" stroke="#33405a"/>
    <text x="48" y="20" fill="#b9c6de" text-anchor="middle">生成总结</text>
    <rect x="108" y="0" width="96" height="30" rx="15" fill="#20283a" stroke="#33405a"/>
    <text x="156" y="20" fill="#b9c6de" text-anchor="middle">关键贡献</text>
    <rect x="216" y="0" width="96" height="30" rx="15" fill="#20283a" stroke="#33405a"/>
    <text x="264" y="20" fill="#b9c6de" text-anchor="middle">方法细节</text>
    <rect x="324" y="0" width="82" height="30" rx="15" fill="#20283a" stroke="#33405a"/>
    <text x="365" y="20" fill="#b9c6de" text-anchor="middle">三行摘要</text>
  </g>

  <!-- meta line (tokens / context) -->
  <text x="68" y="410" font-size="11.5" fill="#6f7b90">↑ 312 tok · ↓ 1.2k tok · context 18% · Opus 5.5</text>

  <!-- footer: model pill + clear -->
  <g transform="translate(68,424)">
    <rect x="0" y="0" width="190" height="30" rx="8" fill="#232c3f" stroke="#3b7ddd"/>
    <text x="14" y="20" font-size="13" font-weight="600" fill="#cfe0ff">Opus 5.5 · chat ▾</text>
    <rect x="556" y="0" width="68" height="30" rx="8" fill="#20283a" stroke="#33405a"/>
    <text x="590" y="20" font-size="13" fill="#9aa6bb" text-anchor="middle">清空</text>
  </g>

  <!-- composer pinned to bottom -->
  <g transform="translate(68,474)">
    <rect x="0" y="0" width="580" height="80" rx="14" fill="#161d2b" stroke="#33405a"/>
    <text x="18" y="30" font-size="14" fill="#6f7b90">有什么尽管问我…</text>
    <circle cx="596" cy="40" r="26" fill="url(#send)"/>
    <text x="596" y="48" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">↑</text>
  </g>
</svg>
